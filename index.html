<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<!-- Content Security Policy: only this site's own files may run. The only outside connections allowed are the
     place search and the three AI providers the person can choose. Inline scripts and styles are blocked. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://geocoding-api.open-meteo.com https://generativelanguage.googleapis.com https://api.groq.com https://openrouter.ai; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0b0a1a">
<meta name="description" content="Vedic astrology with exact calculations: kundali, dasha, panchang and an AI explainer. Free, private, runs in your browser.">
<title>Rashisvara</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>

<div class="app">
  <header class="top">
    <div class="brand">
      <span id="logo" class="logo" aria-hidden="true"></span>
      <div>
        <h1 data-i18n="appName">Rashisvara</h1>
        <p class="tag" data-i18n="tagline"></p>
      </div>
    </div>
    <div class="top-actions">
      <label class="sr-only" for="lang" data-i18n="langLabel">Language</label>
      <select id="lang" class="select-sm"></select>
      <button type="button" id="btn-theme" class="btn btn-ghost btn-sm"></button>
      <button type="button" id="btn-sound" class="btn btn-ghost btn-sm" aria-pressed="true"></button>
    </div>
  </header>

  <nav id="tabs" class="tabs" role="tablist" data-i18n-aria="tabsLabel"></nav>

  <main id="main">
    <noscript><p class="warn">This app needs JavaScript.</p></noscript>

    <section id="panel-home" role="tabpanel" aria-labelledby="tab-home" class="panel"><div id="home-out"></div></section>

    <section id="panel-chart" role="tabpanel" aria-labelledby="tab-chart" class="panel" hidden>
      <form id="birth-form" class="card" novalidate autocomplete="off">
        <div class="row-head">
          <h2 data-i18n="formTitle"></h2>
          <div class="people-bar">
            <label class="sr-only" for="people-select" data-i18n="people"></label>
            <select id="people-select" class="select-sm"></select>
            <button type="button" id="btn-new" class="btn btn-ghost btn-sm" data-i18n="newPerson"></button>
          </div>
        </div>
        <div class="grid">
          <label class="field"><span data-i18n="fName"></span><input id="f-name" type="text" maxlength="60" autocomplete="off"></label>
          <label class="field"><span data-i18n="fDate"></span><input id="f-date" type="date" min="1900-01-01" required></label>
          <label class="field"><span data-i18n="fTime"></span><input id="f-time" type="time" required></label>
        </div>
        <p class="hint" data-i18n="fTimeNote"></p>
        <label class="check"><input id="f-time-unknown" type="checkbox"><span data-i18n="fTimeUnknown"></span></label>

        <div class="field place">
          <label for="f-place" data-i18n="fPlace"></label>
          <div class="inline">
            <input id="f-place" type="text" maxlength="100" autocomplete="off" data-i18n-ph="fPlacePh">
            <button type="button" id="btn-search" class="btn btn-ghost" data-i18n="fSearch"></button>
          </div>
          <div id="place-results" class="place-results"></div>
          <p id="place-msg" class="hint" aria-live="polite"></p>
        </div>
        <div class="grid">
          <label class="field"><span data-i18n="fLat"></span><input id="f-lat" type="number" step="any" min="-90" max="90" inputmode="decimal"></label>
          <label class="field"><span data-i18n="fLon"></span><input id="f-lon" type="number" step="any" min="-180" max="180" inputmode="decimal"></label>
          <label class="field"><span data-i18n="fTz"></span><input id="f-tz" type="text" list="tz-list" maxlength="64" autocomplete="off" spellcheck="false"><datalist id="tz-list"></datalist></label>
        </div>
        <p id="form-msg" class="msg" role="alert"></p>
        <button type="submit" id="btn-make" class="btn btn-primary btn-big" data-i18n="fGo"></button>
      </form>
      <div id="chart-out"></div>
    </section>

    <section id="panel-dasha" role="tabpanel" aria-labelledby="tab-dasha" class="panel" hidden><div id="dasha-out"></div></section>
    <section id="panel-reading" role="tabpanel" aria-labelledby="tab-reading" class="panel" hidden><div id="reading-out"></div></section>
    <section id="panel-ask" role="tabpanel" aria-labelledby="tab-ask" class="panel" hidden><div id="ask-out"></div></section>
    <section id="panel-learn" role="tabpanel" aria-labelledby="tab-learn" class="panel" hidden><div id="teach-out"></div></section>
    <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" class="panel" hidden><div id="settings-out"></div></section>
  </main>

  <footer class="foot">
    <p data-i18n="foot"></p>
    <p class="small" data-i18n="credits"></p>
    <p class="small"><a href="legal.html" data-i18n="legal"></a></p>
  </footer>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="report" class="rp" aria-hidden="true"></div>

<script src="assets/vendor/astronomy.browser.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/i18n-extra.js"></script>
<script src="js/i18n-outlook.js"></script>
<script src="js/engine.js"></script>
<script src="js/timezone.js"></script>
<script src="js/rules.js"></script>
<script src="js/ashtaka.js"></script>
<script src="js/util.js"></script>
<script src="js/crypto.js"></script>
<script src="js/store.js"></script>
<script src="js/reading.js"></script>
<script src="js/outlook-cal.js"></script>
<script src="js/outlook.js"></script>
<script src="js/outlook-view.js"></script>
<script src="js/ask-router.js"></script>
<script src="js/checker.js"></script>
<script src="js/chart.js"></script>
<script src="js/ai.js"></script>
<script src="js/sound.js"></script>
<script src="js/fx.js"></script>
<script src="js/app.js"></script>
</body>
</html>
